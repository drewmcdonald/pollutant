name: CI

on:
  pull_request:
  workflow_dispatch:

# A PR that gets new pushes doesn't need its older runs finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same three gates the deploy workflow runs, just earlier.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
