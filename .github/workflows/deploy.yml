name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@59.23.1
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Verify and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate the deploy: nothing ships if any of these fail.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Convex first, so the backend is ready before the frontend that calls it.
      - name: Deploy Convex functions
        run: pnpm exec convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Strip whitespace a copy-paste may have left on the secret, then prove the
      # token works before we do anything that is annoying to half-finish.
      - name: Authenticate with Vercel
        env:
          VERCEL_TOKEN_RAW: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$VERCEL_TOKEN_RAW" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is empty."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          if ! npx --yes "$VERCEL_CLI" whoami --token="$TOKEN"; then
            echo "::error::VERCEL_TOKEN is not valid for team ${VERCEL_ORG_ID}. Recreate it at https://vercel.com/account/settings/tokens with scope 'drewmcdonald'."
            exit 1
          fi

      - name: Pull Vercel production settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
